<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zuu VPN</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
    :root{
        --bg:#070b16; --bg2:#0b1222;
        --card:rgba(255,255,255,0.045); --card2:rgba(255,255,255,0.08);
        --border:rgba(255,255,255,0.08); --border2:rgba(255,255,255,0.14);
        --text:#f1f5f9; --sub:#9aa6bb; --dim:#64748b;
        --accent:#38bdf8; --accent2:#0ea5e9; --indigo:#6366f1;
        --grad:linear-gradient(135deg,#38bdf8 0%,#6366f1 100%);
        --success:#10b981; --gold:#f59e0b;
        --r:20px; --rsm:14px;
    }
    body.light-mode{
        --bg:#eef2f8; --bg2:#ffffff; --card:rgba(255,255,255,0.75); --card2:rgba(255,255,255,0.95);
        --border:rgba(15,23,42,0.07); --border2:rgba(15,23,42,0.12);
        --text:#0f172a; --sub:#475569; --dim:#94a3b8;
    }
    body{
        font-family:'Inter',-apple-system,sans-serif;
        background:var(--bg); color:var(--text);
        padding:18px 16px 40px; line-height:1.5; overflow-x:hidden;
        -webkit-font-smoothing:antialiased; transition:background .3s;
        min-height:100vh; position:relative;
    }
    body::before{
        content:''; position:fixed; inset:0; z-index:-1; pointer-events:none;
        background:
          radial-gradient(620px 420px at 50% -8%, rgba(99,102,241,0.20), transparent 70%),
          radial-gradient(500px 400px at 100% 100%, rgba(56,189,248,0.12), transparent 70%);
    }
    .h1{font-family:'Space Grotesk',sans-serif;font-weight:700;letter-spacing:-.5px;}

    /* HEADER */
    .header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:22px;}
    .brand h2{margin:0;font-size:24px;font-family:'Space Grotesk',sans-serif;font-weight:700;letter-spacing:-.6px;
        background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
    .status-pill{display:inline-flex;align-items:center;gap:7px;background:rgba(16,185,129,0.12);
        color:var(--success);padding:5px 11px;border-radius:100px;font-size:11px;font-weight:600;margin-top:7px;
        border:1px solid rgba(16,185,129,0.2);}
    .pulse{width:6px;height:6px;border-radius:50%;background:currentColor;box-shadow:0 0 0 0 rgba(16,185,129,.5);animation:pulse 2s infinite;}
    @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(16,185,129,.5)}70%{box-shadow:0 0 0 7px rgba(16,185,129,0)}100%{box-shadow:0 0 0 0 rgba(16,185,129,0)}}
    .theme-toggle{background:var(--card);border:1px solid var(--border);color:var(--accent);width:44px;height:44px;
        border-radius:14px;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(10px);font-size:16px;cursor:pointer;}
    .theme-toggle:active{transform:scale(.92);}

    /* CARD */
    .card{background:var(--card);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
        border-radius:var(--r);padding:18px;border:1px solid var(--border);margin-bottom:16px;
        box-shadow:0 12px 34px -16px rgba(0,0,0,.55);}
    .card-title{font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:600;display:flex;align-items:center;gap:9px;margin-bottom:14px;}
    .card-title i{color:var(--accent);}

    /* ACCOUNT */
    .acct{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
    .acct-cell{background:var(--card2);border:1px solid var(--border);border-radius:var(--rsm);padding:13px 14px;}
    .acct-cell.wide{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;}
    .acct-l{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;display:flex;align-items:center;gap:7px;margin-bottom:5px;}
    .acct-v{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:17px;}
    .acct-cell.wide .acct-l{margin-bottom:0;}

    /* BUTTONS */
    .btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:15px;border-radius:16px;
        border:none;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px;cursor:pointer;
        transition:transform .15s,box-shadow .2s,opacity .2s;color:#fff;}
    .btn-primary{background:var(--grad);box-shadow:0 10px 26px -8px rgba(56,189,248,.55);}
    .btn-success{background:linear-gradient(135deg,#34d399,#059669);box-shadow:0 10px 26px -8px rgba(16,185,129,.5);}
    .btn-soft{background:rgba(56,189,248,.1);color:var(--accent);border:1px solid rgba(56,189,248,.3);box-shadow:none;}
    .btn:active{transform:scale(.97);}
    .btn:disabled{background:#475569!important;color:#94a3b8!important;opacity:.7;cursor:not-allowed;box-shadow:none!important;}

    /* MAP */
    .map-container{height:200px;width:100%;border-radius:var(--rsm);border:1px solid var(--border);overflow:hidden;}
    .leaflet-container{background:transparent!important;}
    .servers-meta{display:flex;align-items:center;gap:6px;margin-top:12px;font-size:12px;color:var(--sub);}
    .servers-meta b{color:var(--accent);font-family:'Space Grotesk',sans-serif;}

    /* LUCKY WHEEL */
    .wheel-card{text-align:center;background:
        linear-gradient(180deg,rgba(99,102,241,.08),rgba(56,189,248,0) 60%),var(--card);
        border:1px solid rgba(99,102,241,.22);}
    .wheel-wrap{position:relative;width:230px;height:230px;margin:6px auto 14px;}
    .wheel{width:100%;height:100%;border-radius:50%;position:relative;
        border:6px solid rgba(255,255,255,.08);box-shadow:0 0 0 6px rgba(99,102,241,.12),0 18px 40px -12px rgba(0,0,0,.6);
        background:conic-gradient(
            #1e2740 0deg 45deg, #f59e0b 45deg 90deg, #1e2740 90deg 135deg, #10b981 135deg 180deg,
            #1e2740 180deg 225deg, #f59e0b 225deg 270deg, #1e2740 270deg 315deg, #10b981 315deg 360deg);
        will-change:transform;}
    .wheel-seg{position:absolute;left:50%;top:8px;transform-origin:0 107px;font-size:15px;}
    .wheel-hub{position:absolute;inset:0;margin:auto;width:54px;height:54px;border-radius:50%;
        background:var(--bg2);border:3px solid rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;
        font-size:22px;box-shadow:0 4px 14px rgba(0,0,0,.5);}
    .wheel-pointer{position:absolute;top:-6px;left:50%;transform:translateX(-50%);z-index:3;
        width:0;height:0;border-left:11px solid transparent;border-right:11px solid transparent;border-top:18px solid var(--accent);
        filter:drop-shadow(0 2px 4px rgba(0,0,0,.5));}
    .wheel-legend{display:flex;justify-content:center;gap:14px;font-size:11px;color:var(--sub);margin-bottom:16px;flex-wrap:wrap;}
    .wheel-legend span{display:inline-flex;align-items:center;gap:5px;}
    .dot{width:9px;height:9px;border-radius:3px;}
    #timer-text{font-size:12px;margin-top:12px;font-weight:500;color:var(--sub);}

    /* SPEEDTEST */
    .speed-display{margin:6px 0 4px;}
    .speed-value{font-family:'Space Grotesk',sans-serif;font-size:46px;font-weight:700;line-height:1;
        background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
    .speed-unit{font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.12em;margin-top:4px;}
    .progress-container{width:100%;height:7px;background:rgba(255,255,255,.06);border-radius:10px;margin-top:14px;overflow:hidden;}
    .progress-bar{width:0%;height:100%;background:var(--grad);border-radius:10px;transition:width .25s ease;}

    /* INSTALL */
    .device-tabs{display:flex;background:var(--card);padding:5px;border-radius:16px;gap:5px;margin-bottom:14px;border:1px solid var(--border);}
    .tab-btn{flex:1;padding:11px;border:none;background:transparent;color:var(--sub);border-radius:12px;
        font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:600;cursor:pointer;transition:all .25s;}
    .tab-btn.active{background:var(--grad);color:#fff;box-shadow:0 6px 16px -6px rgba(56,189,248,.5);}
    .app-card{display:flex;align-items:center;gap:13px;background:var(--card);padding:13px;border-radius:16px;
        border:1px solid var(--border);margin-bottom:10px;}
    .app-icon{width:46px;height:46px;background:linear-gradient(135deg,rgba(56,189,248,.14),rgba(99,102,241,.14));
        border-radius:14px;display:flex;align-items:center;justify-content:center;color:var(--accent);font-size:21px;
        border:1px solid rgba(56,189,248,.2);flex-shrink:0;}
    .app-name{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:14px;}
    .app-ver{font-size:12px;color:var(--dim);}
    .dl-link{background:var(--grad);color:#fff;text-decoration:none;padding:9px 16px;border-radius:12px;
        font-size:12px;font-weight:700;font-family:'Space Grotesk',sans-serif;box-shadow:0 4px 12px -4px rgba(56,189,248,.4);}
    .dl-link:active{transform:scale(.95);}
    .support-btn{display:flex;align-items:center;justify-content:center;gap:11px;background:rgba(56,189,248,.06);
        border:1.5px dashed rgba(56,189,248,.32);padding:16px;border-radius:18px;color:var(--accent);text-decoration:none;
        font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:14px;margin-top:6px;}
    .support-btn:active{background:rgba(56,189,248,.12);}
    .fade-in{animation:fade .5s ease both;}
    @keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
    </style>
</head>
<body>

    <div class="header fade-in">
        <div class="brand">
            <h2>Zuu VPN</h2>
            <div class="status-pill"><span class="pulse"></span> Защищённое соединение</div>
        </div>
        <button class="theme-toggle" onclick="toggleTheme()"><i class="fas fa-moon" id="theme-icon"></i></button>
    </div>

    <!-- ACCOUNT -->
    <div class="card fade-in">
        <div class="acct">
            <div class="acct-cell wide">
                <span class="acct-l"><i class="fas fa-user-circle"></i> Аккаунт ID</span>
                <span class="acct-v" id="u-id">…</span>
            </div>
            <div class="acct-cell">
                <div class="acct-l"><i class="fas fa-wallet"></i> Баланс</div>
                <div class="acct-v" id="u-bal" style="color:var(--success)">0₽</div>
            </div>
            <div class="acct-cell">
                <div class="acct-l"><i class="fas fa-clock"></i> Подписка</div>
                <div class="acct-v" id="u-exp" style="font-size:14px">…</div>
            </div>
        </div>
    </div>

    <!-- IMPORT -->
    <div id="import-card" class="card fade-in" style="display:none;border:1px solid rgba(16,185,129,.3);background:linear-gradient(180deg,rgba(16,185,129,.07),transparent)">
        <div class="card-title"><i class="fas fa-bolt" style="color:var(--success)"></i> Быстрая настройка</div>
        <button class="btn btn-success" onclick="importToHapp()">
            <i class="fas fa-file-import"></i> Импортировать в Happ
        </button>
    </div>

    <!-- MAP -->
    <div class="card fade-in">
        <div class="card-title"><i class="fas fa-map-marker-alt"></i> Наши сервера</div>
        <div id="map" class="map-container"></div>
        <div class="servers-meta"><i class="fas fa-circle" style="font-size:7px;color:var(--success)"></i> <b>25+</b> локаций · низкий пинг по всему миру</div>
    </div>

    <!-- LUCKY WHEEL -->
    <div class="card wheel-card fade-in">
        <div class="card-title" style="justify-content:center"><span style="font-size:18px">🎁</span> Lucky Wheel</div>
        <div class="wheel-wrap">
            <div class="wheel-pointer"></div>
            <div class="wheel" id="wheel">
                <div class="wheel-hub">🍀</div>
            </div>
        </div>
        <div class="wheel-legend">
            <span><i class="dot" style="background:#f59e0b"></i>10₽</span>
            <span><i class="dot" style="background:#10b981"></i>+1 день</span>
            <span><i class="dot" style="background:#1e2740;border:1px solid var(--border2)"></i>пусто</span>
        </div>
        <button class="btn btn-primary" id="spin-btn" onclick="startSpin()">Крутить бонус</button>
        <div id="timer-text">Загрузка…</div>
    </div>

    <!-- SPEEDTEST -->
    <div class="card fade-in" style="text-align:center">
        <div class="card-title" style="justify-content:flex-start"><i class="fas fa-gauge-high"></i> Тест скорости</div>
        <div class="speed-display">
            <div class="speed-value" id="speed-mbps">0.0</div>
            <div class="speed-unit">Мбит/с</div>
        </div>
        <div class="progress-container"><div class="progress-bar" id="speed-progress"></div></div>
        <button class="btn btn-soft" id="test-btn" onclick="runSpeedTest()" style="margin-top:15px">Начать проверку</button>
    </div>

    <!-- INSTALL -->
    <div class="card fade-in">
        <div class="card-title"><i class="fas fa-download"></i> Установка приложений</div>
        <div class="device-tabs">
            <button class="tab-btn active" onclick="switchDevice('android', this)">Android</button>
            <button class="tab-btn" onclick="switchDevice('ios', this)">iOS</button>
            <button class="tab-btn" onclick="switchDevice('pc', this)">Desktop</button>
        </div>
        <div id="app-list"></div>
        <a href="https://t.me/zuufeedback_bot" target="_blank" class="support-btn">
            <i class="fas fa-headset"></i> Поддержка: @zuufeedback_bot
        </a>
    </div>

    <script>
    // --- Кэш-бастер (одноразово при первом открытии) ---
    (function(){
        const u = new URL(window.location.href);
        if(!u.searchParams.get('v')){ u.searchParams.set('v', Date.now()); window.location.replace(u.toString()); }
    })();

    const tg = window.Telegram.WebApp;
    tg.expand(); tg.ready();

    const params = new URLSearchParams(window.location.search);
    const userExp = params.get('exp');
    const lastSpin = parseFloat(params.get('ls')) || 0;
    const cooldownSeconds = 518400;

    // Данные аккаунта (из URL, как присылает бот)
    document.getElementById('u-id').innerText  = params.get('id')  || 'Неизвестно';
    document.getElementById('u-bal').innerText = (params.get('bal') || '0') + '₽';
    document.getElementById('u-exp').innerText = userExp || 'Нет активной';

    // --- Импорт в Happ (логика сохранена 1-в-1) ---
    function setupImportButton(){ document.getElementById('import-card').style.display = 'block'; }
    function importToHapp(){
        const enc = new URLSearchParams(window.location.search).get('enc_link');
        const expDate = document.getElementById('u-exp').innerText;
        if(!enc || expDate === 'Нет активной' || expDate === '…' || expDate === '' || expDate === '...'){
            tg.HapticFeedback.notificationOccurred('error');
            tg.showAlert("⚠️ Сначала купите подписку в боте, чтобы получить настройки VPN!");
            return;
        }
        let finalUrl = enc;
        if(!finalUrl.startsWith('happ://')) finalUrl = `happ://add/${finalUrl}`;
        tg.HapticFeedback.notificationOccurred('success');
        tg.openLink(finalUrl, { try_instant_view: false });
    }
    setupImportButton();

    // --- Карта серверов ---
    let map;
    function initMap(){
        const locations = [
            {name:"Россия 🇷🇺",coords:[55.75,37.61]},{name:"Германия 🇩🇪",coords:[52.52,13.40]},
            {name:"Финляндия 🇫🇮",coords:[60.16,24.93]},{name:"Польша 🇵🇱",coords:[52.23,21.01]},
            {name:"Нидерланды 🇳🇱",coords:[52.36,4.88]},{name:"Швеция 🇸🇪",coords:[59.32,18.06]},
            {name:"Австрия 🇦🇹",coords:[48.20,16.37]},{name:"Латвия 🇱🇻",coords:[56.94,24.10]},
            {name:"Литва 🇱🇹",coords:[54.68,25.27]},{name:"Великобритания 🇬🇧",coords:[51.50,-0.12]},
            {name:"Франция 🇫🇷",coords:[48.85,2.35]},{name:"Швейцария 🇨🇭",coords:[46.94,7.44]},
            {name:"Чехия 🇨🇿",coords:[50.07,14.43]},{name:"Испания 🇪🇸",coords:[40.41,-3.70]},
            {name:"Турция 🇹🇷",coords:[39.93,32.85]},{name:"ОАЭ 🇦🇪",coords:[25.20,55.27]},
            {name:"Казахстан 🇰🇿",coords:[51.16,71.47]},{name:"США 🇺🇸",coords:[38.90,-77.03]},
            {name:"Канада 🇨🇦",coords:[45.42,-75.69]},{name:"Израиль 🇮🇱",coords:[31.76,35.21]},
            {name:"Индия 🇮🇳",coords:[28.61,77.20]},{name:"Бразилия 🇧🇷",coords:[-15.79,-47.88]},
            {name:"Корея 🇰🇷",coords:[37.56,126.97]},{name:"Япония 🇯🇵",coords:[35.67,139.65]},
            {name:"Австралия 🇦🇺",coords:[-35.28,149.13]}
        ];
        map = L.map('map',{zoomControl:false,attributionControl:false}).setView([45,25],2);
        const isLight = document.body.classList.contains('light-mode');
        L.tileLayer(`https://{s}.basemaps.cartocdn.com/${isLight?'light_all':'dark_all'}/{z}/{x}/{y}{r}.png`).addTo(map);
        const dotIcon = L.divIcon({className:'map-dot',
            html:`<div style="background:#38bdf8;width:9px;height:9px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 10px #38bdf8;"></div>`,
            iconSize:[13,13]});
        locations.forEach(loc=>L.marker(loc.coords,{icon:dotIcon}).addTo(map).bindPopup(`<b>${loc.name}</b>`));
    }

    // --- Таймер колеса ---
    function updateTimer(){
        const btn = document.getElementById('spin-btn');
        const t = document.getElementById('timer-text');
        const now = Math.floor(Date.now()/1000);
        const left = (lastSpin + cooldownSeconds) - now;
        if(left > 0){
            btn.disabled = true;
            const d = Math.floor(left/86400), h = Math.floor((left%86400)/3600);
            btn.innerText = `Доступно через ${d}д ${h}ч`;
            t.innerHTML = `<i class="fas fa-lock"></i> Бонус раз в неделю`;
            return true;
        }
        btn.disabled = false; btn.innerText = "Крутить бонус";
        t.style.color = "var(--success)"; t.innerHTML = `<i class="fas fa-check-circle"></i> Можно крутить!`;
        return false;
    }

    // --- Анимированное колесо (приз и sendData сохранены 1-в-1 с ботом) ---
    function startSpin(){
        if(updateTimer()) return;
        const btn = document.getElementById('spin-btn');
        const wheel = document.getElementById('wheel');
        btn.disabled = true; btn.innerText = "Крутим…";
        try{ tg.HapticFeedback.impactOccurred('medium'); }catch(e){}

        const rand = Math.random()*100;
        let prize, msg, segs;
        if(rand < 15){ prize={action:'wheel_prize',type:'money',amount:10}; msg="🎁 Вы выиграли 10₽!"; segs=[1,5]; }
        else if(rand < 30){ prize={action:'wheel_prize',type:'sub'}; msg="📅 +1 день к подписке!"; segs=[3,7]; }
        else { prize={action:'wheel_prize',type:'nothing'}; msg="😢 Повезёт в следующий раз!"; segs=[0,2,4,6]; }
        const k = segs[Math.floor(Math.random()*segs.length)];
        const finalRot = 360*6 + (360 - (k*45 + 22.5));

        wheel.style.transition = 'none'; wheel.style.transform = 'rotate(0deg)';
        void wheel.offsetWidth;
        wheel.style.transition = 'transform 4.2s cubic-bezier(0.17,0.67,0.16,1)';
        wheel.style.transform = `rotate(${finalRot}deg)`;

        setTimeout(()=>{
            try{ tg.HapticFeedback.notificationOccurred(prize.type==='nothing'?'warning':'success'); }catch(e){}
            tg.showAlert(msg, ()=>{ tg.sendData(JSON.stringify(prize)); tg.close(); });
        }, 4400);
    }

    // --- Тема ---
    function toggleTheme(){
        document.body.classList.toggle('light-mode');
        const isLight = document.body.classList.contains('light-mode');
        document.getElementById('theme-icon').className = isLight ? 'fas fa-sun' : 'fas fa-moon';
        try{ tg.setHeaderColor(isLight ? '#eef2f8' : '#070b16'); }catch(e){}
        if(map){ map.remove(); initMap(); }
    }

    // --- Приложения ---
    const appData = {
        android:[
            {name:'v2rayTun',ver:'Официальный клиент',icon:'fa-robot',link:'https://play.google.com/store/apps/details?id=com.v2raytun.android'},
            {name:'Happ Proxy',ver:'Лёгкий и быстрый',icon:'fa-bolt',link:'https://play.google.com/store/apps/details?id=com.happproxy'}
        ],
        ios:[
            {name:'Happ Proxy',ver:'App Store (Free)',icon:'fa-mobile-screen-button',link:'https://apps.apple.com/us/app/happ-proxy-utility/id6504287215'},
            {name:'Streisand',ver:'Премиум',icon:'fa-paper-plane',link:'https://apps.apple.com/app/streisand/id6450534064'}
        ],
        pc:[
            {name:'v2rayN',ver:'Windows x64',icon:'fa-desktop',link:'https://github.com/2dust/v2rayN/releases'}
        ]
    };
    function renderApps(p){
        const c = document.getElementById('app-list'); c.innerHTML = '';
        appData[p].forEach(a=>{
            c.innerHTML += `<div class="app-card"><div class="app-icon"><i class="fas ${a.icon}"></i></div>
                <div style="flex:1"><div class="app-name">${a.name}</div><div class="app-ver">${a.ver}</div></div>
                <a href="${a.link}" target="_blank" class="dl-link">Скачать</a></div>`;
        });
    }
    function switchDevice(p, btn){
        document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active'); renderApps(p);
    }

    // --- Спидтест (логика сохранена) ---
    async function runSpeedTest(){
        const btn = document.getElementById('test-btn');
        const val = document.getElementById('speed-mbps');
        const bar = document.getElementById('speed-progress');
        btn.disabled = true; btn.innerText = "Замеряем…"; val.innerText = "0.0"; bar.style.width = "0%";
        const testFile = "https://upload.wikimedia.org/wikipedia/commons/3/3a/Russia_Relief_Location_map.jpg?cache=" + Math.random();
        const fileBits = 5*1024*1024*8;
        const start = Date.now();
        try{
            const resp = await fetch(testFile);
            const reader = resp.body.getReader();
            let loaded = 0;
            while(true){
                const {done,value} = await reader.read();
                if(done) break;
                loaded += value.length;
                bar.style.width = Math.min((loaded/(5*1024*1024))*100,100) + "%";
            }
            const dur = (Date.now()-start)/1000;
            val.innerText = (fileBits/dur/1000000).toFixed(1);
            btn.innerText = "Повторить тест";
        }catch(e){
            tg.showAlert("Ошибка теста. Проверьте соединение.");
            btn.innerText = "Ошибка";
        }finally{ btn.disabled = false; }
    }

    // --- Инициализация ---
    updateTimer();
    setTimeout(initMap, 200);
    renderApps('android');
    if(tg.colorScheme === 'light') toggleTheme();
    </script>
</body>
</html>
